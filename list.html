<!DOCTYPE html>
<html>
<head>
    <title>GMAX - Member Directory</title>
    <style>
        
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #333; color: white; }
        .profile-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .qr-img { width: 50px; cursor: pointer; }
        .status-active { color: green; font-weight: bold; }
        .status-expired { color: red; font-weight: bold; }
        .status-warning { color: orangered; font-weight: bold; }
    </style>
</head>
<body>
    <nav style="background: #333; padding: 15px; margin-bottom: 20px;">
    <a href="index.html" style="color: white; margin-right: 20px; text-decoration: none;">🏠 Scanner</a>
    <a href="list.html" style="color: white; margin-right: 20px; text-decoration: none;">📋 Member List</a>
    <a href="test.html" style="color: white; text-decoration: none;">➕ Add Member</a>
</nav>
    <h1>Member Directory</h1>
    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
    <div style="flex: 1; background: #007bff; color: white; padding: 20px; border-radius: 10px; text-align: center;">
        <h3>Total Members</h3>
        <p id="stat-total" style="font-size: 24px; font-weight: bold;">0</p>
    </div>
    <div style="flex: 1; background: #28a745; color: white; padding: 20px; border-radius: 10px; text-align: center;">
        <h3>Active Now</h3>
        <p id="stat-active" style="font-size: 24px; font-weight: bold;">0</p>
    </div>
    <div style="flex: 1; background: #ffc107; color: #333; padding: 20px; border-radius: 10px; text-align: center;">
        <h3>New Today</h3>
        <p id="stat-new" style="font-size: 24px; font-weight: bold;">0</p>
    </div>
</div>
    
    <br><div style="margin-bottom: 20px;">
    <input type="text" id="searchInput" placeholder="Search by name or UUID..." 
        style="padding: 10px; width: 100%; max-width: 400px; border-radius: 5px; border: 1px solid #ccc;">
<div style="margin-bottom: 20px;">
    <button onclick="filterTable('all')">All</button>
    <button onclick="filterTable('expired')">Expired</button>
    <button onclick="filterTable('warning')">Expiring Soon</button>
    <button onclick="filterTable('active')">Active</button>
</div><br>
    <table>
        <thead>
            <tr>
                <th>Photo</th>
                <th>Name</th>
                <th>phone number</th>
                <th>UUID</th>
                <th>Expiry Date</th>
                <th>Status</th>
                <th>QR Code</th>
<th>Actions</th>
            </tr>
        </thead>
        <tbody id="memberTable">
            </tbody>
    </table>

    <script>
        fetch('http://localhost:3000/members')
            .then(res => res.json())
            .then(members => {
                const tableBody = document.getElementById('memberTable');
                const today = new Date();
            if (members.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align:center; padding: 20px; color: #666;">
                            No members found. <a href="test.html">Click here to add your first member!</a>
                        </td>
                    </tr>`;
                return; // Stop the rest of the code from running
            }
      // Inside your fetch().then(members => { ... })
members.forEach(member => {
    const today = new Date();
    const expiryDate = new Date(member.expiry_date);
    const diffTime = expiryDate - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

    let statusClass = "";
    let statusValue = ""; // This will be used for filtering

    if (diffDays < 0) {
        statusClass = "status-expired";
        statusValue = "expired";
    } else if (diffDays <= 7) {
        statusClass = "status-warning";
        statusValue = "warning";
    } else {
        statusClass = "status-active";
        statusValue = "active";
    }

    const row = `
        <tr id="row-${member.id}" data-status="${statusValue}"> 
            <td><img src="${member.photo_path}" class="profile-img"></td>
            <td><a href="profile.html?id=${member.id}" style="color:blue; font-weight:bold;">${member.name}</a></td>
            <td>${member.phone}</td>
            <td><code>${member.uuid}</code></td>
            <td>${member.expiry_date}</td>
            <td class="${statusClass}">${statusValue.toUpperCase()}</td>
            <td><img src="qrcodes/${member.uuid}.png" class="qr-img" onclick="window.open(this.src)"></td>
            <td>
                <button onclick="extendMember(${member.id})" style="background:orange; color:white; border:none; padding:5px; cursor:pointer;">Extend</button>
                <button onclick="deleteMember(${member.id})" style="background:red; color:white; border:none; padding:5px; cursor:pointer;">Delete</button>
            </td>
        </tr>
    `;
    tableBody.innerHTML += row;
});
            });
    function deleteMember(id) {
    if (confirm("Are you sure you want to delete this member?")) {
        fetch(`http://localhost:3000/members/${id}`, { method: 'DELETE' })
        .then(() => {
            document.getElementById(`row-${id}`).remove();
            alert("Member removed.");
        });
    }
}

function extendMember(id) {
    const newDate = prompt("Enter new expiry date (YYYY-MM-DD):");
    if (newDate) {
        fetch(`http://localhost:3000/members/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ new_expiry: newDate })
        })
        .then(() => {
            alert("Membership updated! Refresh to see changes.");
            location.reload();
        });
    }
}
document.getElementById('searchInput').addEventListener('keyup', function() {
    const searchTerm = this.value.toLowerCase();
    const tableRows = document.querySelectorAll('#memberTable tr');

    tableRows.forEach(row => {
        // We look at the Name (column 2) and UUID (column 3)
        const name = row.cells[1].textContent.toLowerCase();
        const uuid = row.cells[2].textContent.toLowerCase();

        if (name.includes(searchTerm) || uuid.includes(searchTerm)) {
            row.style.display = ""; // Show it
        } else {
            row.style.display = "none"; // Hide it
        }
    });
});
function filterTable(status) {
    // Get all rows that have a data-status attribute
    const rows = document.querySelectorAll("tr[data-status]");

    rows.forEach(row => {
        if (status === 'all') {
            row.style.display = ''; // Show everything
        } else if (row.getAttribute('data-status') === status) {
            row.style.display = ''; // Show match
        } else {
            row.style.display = 'none'; // Hide non-match
        }
    });
}

function loadStats() {
    fetch('http://localhost:3000/admin-stats')
        .then(res => res.json())
        .then(data => {
            document.getElementById('stat-total').innerText = data.total_members || 0;
            document.getElementById('stat-active').innerText = data.active_members || 0;
            document.getElementById('stat-new').innerText = data.new_today || 0;
        });
}

// Call this when the page loads
loadStats();
    </script>
</body>
</html>
